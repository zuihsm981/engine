name: Build Docker Image (Flutter Engine 3.24.3)

on:
  workflow_dispatch:   # 手动触发

permissions:
  contents: read
  packages: write      # 允许推送镜像到 GitHub Container Registry

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get engine revision
        id: get_rev
        run: |
          REV=$(curl -s https://raw.githubusercontent.com/flutter/flutter/3.24.3/bin/internal/engine.version)
          echo "revision=$REV" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: ENGINE_REVISION=${{ steps.get_rev.outputs.revision }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flutter-engine-builder:3.24.3
