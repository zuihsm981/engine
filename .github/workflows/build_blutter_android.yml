name: Build Blutter Android Runner (.so)

on:
  workflow_dispatch:

jobs:
  build-android-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev libfmt-dev wget unzip
          pip install requests pyelftools

      - name: Setup Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Clone Blutter
        run: git clone https://github.com/worawit/blutter.git

      - name: Force blutter.py to target Android/arm64
        run: |
          cd blutter
          sed -i "s|sys.platform|'android'|g" blutter.py
          sed -i "s|platform.machine()|'arm64'|g" blutter.py

      - name: Patch dartvm_fetch_build.py - add NDK params and error output
        run: |
          cd blutter
          # 添加 NDK 参数到 CMake 行
          sed -i "s|'--log-level=NOTICE'|'--log-level=NOTICE', '-DCMAKE_TOOLCHAIN_FILE=' + os.environ.get('NDK_HOME', '') + '/build/cmake/android.toolchain.cmake', '-DANDROID_ABI=arm64-v8a', '-DANDROID_PLATFORM=android-21', '-DCMAKE_C_COMPILER=aarch64-linux-android21-clang', '-DCMAKE_CXX_COMPILER=aarch64-linux-android21-clang++'|g" dartvm_fetch_build.py
          # 确保 import os, sys
          grep -q "^import os" dartvm_fetch_build.py || sed -i "1i import os" dartvm_fetch_build.py
          grep -q "^import sys" dartvm_fetch_build.py || sed -i "2i import sys" dartvm_fetch_build.py
          # 用 Python 脚本替换 subprocess.run 调用为带错误输出的版本
          python3 << 'EOF'
          import re
          with open('dartvm_fetch_build.py', 'r') as f:
              lines = f.readlines()
          new_lines = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip().startswith('subprocess.run([CMAKE_CMD,') and '--log-level=NOTICE' in line:
                  indent = ' ' * (len(line) - len(line.lstrip()))
                  # 替换为 try-except 包装
                  new_lines.append(indent + 'try:\n')
                  new_lines.append(indent + f'    result = subprocess.run({line.strip().rstrip(",")}, capture_output=True, text=True, check=False)\n')
                  new_lines.append(indent + '    if result.returncode != 0:\n')
                  new_lines.append(indent + '        print("CMake Error:")\n')
                  new_lines.append(indent + '        print(result.stderr)\n')
                  new_lines.append(indent + '        sys.exit(result.returncode)\n')
                  new_lines.append(indent + 'except Exception as e:\n')
                  new_lines.append(indent + '    print(e)\n')
                  new_lines.append(indent + '    sys.exit(1)\n')
                  i += 1
              else:
                  new_lines.append(line)
                  i += 1
          with open('dartvm_fetch_build.py', 'w') as f:
              f.writelines(new_lines)
          EOF

      - name: Debug - show modified subprocess.run
        run: |
          cd blutter
          grep -A10 "subprocess.run" dartvm_fetch_build.py | head -20

      - name: Run blutter.py (will trigger build)
        working-directory: blutter
        run: |
          python3 blutter.py ../libs/arm64-v8a ../output

      - name: Extract snapshot hash from libapp.so
        id: get_hash
        run: |
          ADDR=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $1}')
          SIZE=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $2}')
          if [ -z "$ADDR" ] || [ -z "$SIZE" ]; then
            echo "Error: Could not find _kDartVmSnapshotData"
            exit 1
          fi
          dd if=libs/arm64-v8a/libapp.so of=snapshot_data.bin bs=1 skip=$((0x$ADDR)) count=$((0x$SIZE)) status=none
          HASH=$(sha256sum snapshot_data.bin | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Find and rename generated .so
        run: |
          cd blutter
          SO_FILE=$(find . -name "libdartvm*.so" -type f | head -1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find . -name "libblutter*.so" -type f | head -1)
          fi
          if [ -z "$SO_FILE" ]; then
            echo "No .so file found!"
            exit 1
          fi
          echo "Found: $SO_FILE"
          cp "$SO_FILE" ../libblutter_${{ steps.get_hash.outputs.hash }}.so

      - name: Upload Android .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libblutter_android_arm64
          path: libblutter_*.so