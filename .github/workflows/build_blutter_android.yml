name: Build Blutter Android .so (NDK ICU)

on:
  workflow_dispatch:

jobs:
  build-android-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git cmake ninja-build build-essential pkg-config libcapstone-dev libfmt-dev wget unzip
          pip install requests pyelftools

      - name: Setup Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set ICU paths from NDK
        run: |
          # NDK 中 ICU 头文件位置
          export ICU_INCLUDE_DIR="$NDK_HOME/sysroot/usr/include"
          # NDK 中 ICU 库文件位置（aarch64）
          export ICU_LIBRARY_DIR="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/21"
          # 显式指定库文件（需要完整路径）
          export ICU_UC_LIB="$ICU_LIBRARY_DIR/libicuuc.so"
          export ICU_I18N_LIB="$ICU_LIBRARY_DIR/libicui18n.so"
          export ICU_DATA_LIB="$ICU_LIBRARY_DIR/libicudata.so"
          echo "ICU_INCLUDE_DIR=$ICU_INCLUDE_DIR" >> $GITHUB_ENV
          echo "ICU_UC_LIB=$ICU_UC_LIB" >> $GITHUB_ENV
          echo "ICU_I18N_LIB=$ICU_I18N_LIB" >> $GITHUB_ENV
          echo "ICU_DATA_LIB=$ICU_DATA_LIB" >> $GITHUB_ENV

      - name: Clone Blutter
        run: git clone https://github.com/worawit/blutter.git

      - name: Force blutter.py to target Android/arm64
        run: |
          cd blutter
          sed -i "s|sys.platform|'android'|g" blutter.py
          sed -i "s|platform.machine()|'arm64'|g" blutter.py

      - name: Patch dartvm_fetch_build.py for NDK and ICU paths
        run: |
          cd blutter
          # 在 CMake 行中添加 NDK 工具链和 ICU 路径
          sed -i "s|'--log-level=NOTICE'|'--log-level=NOTICE', '-DCMAKE_TOOLCHAIN_FILE=' + os.environ.get('NDK_HOME', '') + '/build/cmake/android.toolchain.cmake', '-DANDROID_ABI=arm64-v8a', '-DANDROID_PLATFORM=android-21', '-DCMAKE_C_COMPILER=aarch64-linux-android21-clang', '-DCMAKE_CXX_COMPILER=aarch64-linux-android21-clang++', '-DICU_INCLUDE_DIR=' + os.environ.get('ICU_INCLUDE_DIR', ''), '-DICU_LIBRARY=' + os.environ.get('ICU_UC_LIB', ''), '-DICU_I18N_LIBRARY=' + os.environ.get('ICU_I18N_LIB', ''), '-DICU_DATA_LIBRARY=' + os.environ.get('ICU_DATA_LIB', '')|g" dartvm_fetch_build.py
          # 确保 import os
          grep -q "^import os" dartvm_fetch_build.py || sed -i "1i import os" dartvm_fetch_build.py

      - name: Debug - check modified CMake line
        run: |
          cd blutter
          grep "subprocess.run" dartvm_fetch_build.py | head -1

      - name: Run blutter.py
        working-directory: blutter
        run: |
          python3 blutter.py ../libs/arm64-v8a ../output

      - name: Extract snapshot hash
        id: get_hash
        run: |
          ADDR=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $1}')
          SIZE=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $2}')
          dd if=libs/arm64-v8a/libapp.so of=snapshot_data.bin bs=1 skip=$((0x$ADDR)) count=$((0x$SIZE)) status=none
          HASH=$(sha256sum snapshot_data.bin | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Find and rename generated .so
        run: |
          cd blutter
          SO_FILE=$(find . -name "libdartvm*.so" -type f | head -1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find . -name "libblutter*.so" -type f | head -1)
          fi
          if [ -z "$SO_FILE" ]; then
            echo "No .so file found!"
            exit 1
          fi
          echo "Found: $SO_FILE"
          cp "$SO_FILE" ../libblutter_${{ steps.get_hash.outputs.hash }}.so

      - name: Upload Android .so artifact
        uses: actions/upload-artifact@v4
        with:
          path: libblutter_*.so