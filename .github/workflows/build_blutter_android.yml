name: Build Blutter Android Runner (.so)

on:
  workflow_dispatch:

jobs:
  build-android-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev libfmt-dev wget unzip
          pip install requests pyelftools

      - name: Setup Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Clone Blutter
        run: git clone https://github.com/worawit/blutter.git

      - name: Patch blutter.py to target Android
        run: |
          cd blutter
          # 强制平台为 android，架构为 arm64
          sed -i "s|sys.platform|'android'|g" blutter.py
          sed -i "s|platform.machine()|'arm64'|g" blutter.py

      - name: Patch dartvm_fetch_build.py for cross-compilation
        run: |
          cd blutter
          # 在 CMake 命令中添加 NDK 交叉编译参数
          sed -i "s|'--log-level=NOTICE'|'--log-level=NOTICE', '-DCMAKE_SYSTEM_NAME=Android', '-DCMAKE_SYSTEM_VERSION=21', '-DCMAKE_C_COMPILER=aarch64-linux-android21-clang', '-DCMAKE_CXX_COMPILER=aarch64-linux-android21-clang++'|" dartvm_fetch_build.py

      - name: Run blutter.py (will trigger build)
        working-directory: blutter
        run: |
          python3 blutter.py ../libs/arm64-v8a ../output

      - name: Extract snapshot hash from libapp.so
        id: get_hash
        run: |
          ADDR=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $1}')
          SIZE=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $2}')
          if [ -z "$ADDR" ] || [ -z "$SIZE" ]; then
            echo "Error: Could not find _kDartVmSnapshotData"
            exit 1
          fi
          dd if=libs/arm64-v8a/libapp.so of=snapshot_data.bin bs=1 skip=$((0x$ADDR)) count=$((0x$SIZE)) status=none
          HASH=$(sha256sum snapshot_data.bin | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Find and rename generated .so
        run: |
          cd blutter
          # 查找所有 .so 文件（可能在 build/ 或 bin/ 下）
          SO_FILE=$(find . -name "libdartvm*.so" -type f | head -1)
          if [ -z "$SO_FILE" ]; then
            # 也可能命名为 libblutter*.so
            SO_FILE=$(find . -name "libblutter*.so" -type f | head -1)
          fi
          if [ -z "$SO_FILE" ]; then
            echo "No .so file found!"
            exit 1
          fi
          echo "Found: $SO_FILE"
          cp "$SO_FILE" ../libblutter_${{ steps.get_hash.outputs.hash }}.so

      - name: Upload Android .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libblutter_android_arm64
          path: libblutter_*.so