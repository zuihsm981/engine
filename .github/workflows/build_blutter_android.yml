name: Build Blutter Android Runner (.so)

on:
  workflow_dispatch:

jobs:
  build-android-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev libfmt-dev wget unzip
          pip install requests pyelftools

      - name: Setup Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Clone Blutter
        run: git clone https://github.com/worawit/blutter.git

      - name: Patch dartvm_fetch_build.py for Android cross-compilation
        run: |
          cd blutter
          # 修改编译器为 NDK 的 clang++
          sed -i 's|g++|aarch64-linux-android21-clang++|g' dartvm_fetch_build.py
          # 添加 -shared -fPIC 以生成动态库
          sed -i 's|-O2|-O2 -fPIC -shared -target aarch64-linux-android21|g' dartvm_fetch_build.py
          # 将输出文件名从 blutter_dartvm 改为 libblutter.so
          sed -i 's|blutter_dartvm|libblutter.so|g' dartvm_fetch_build.py

      - name: Run Blutter to trigger build
        run: |
          cd blutter
          python3 blutter.py ../libs/arm64-v8a ../output || true

      - name: Extract snapshot hash
        id: get_hash
        run: |
          ADDR=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $1}')
          SIZE=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $2}')
          if [ -z "$ADDR" ] || [ -z "$SIZE" ]; then
            echo "Error: Could not find _kDartVmSnapshotData"
            exit 1
          fi
          dd if=libs/arm64-v8a/libapp.so of=snapshot_data.bin bs=1 skip=$((0x$ADDR)) count=$((0x$SIZE)) status=none
          HASH=$(sha256sum snapshot_data.bin | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Rename and upload .so
        run: |
          cd blutter
          if [ -f libblutter.so ]; then
            mv libblutter.so ../libblutter_${{ steps.get_hash.outputs.hash }}.so
          elif [ -f bin/libblutter.so ]; then
            mv bin/libblutter.so ../libblutter_${{ steps.get_hash.outputs.hash }}.so
          else
            echo "libblutter.so not found!"
            exit 1
          fi

      - name: Upload Android .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libblutter_android_arm64
          path: libblutter_*.so