name: Build Blutter Android .so (with ICU)

on:
  workflow_dispatch:

jobs:
  build-android-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev libfmt-dev wget unzip
          pip install requests pyelftools

      - name: Setup Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download Android ICU prebuilt
        run: |
          # 下载 ICU 4c 71.1 Android 版本（可根据 Dart 版本调整）
          wget https://github.com/unicode-org/icu/releases/download/release-71-1/icu4c-71_1-Android.zip
          unzip icu4c-71_1-Android.zip -d icu_android
          echo "ICU_ROOT=$PWD/icu_android" >> $GITHUB_ENV

      - name: Clone Blutter
        run: git clone https://github.com/worawit/blutter.git

      - name: Force blutter.py to target Android/arm64
        run: |
          cd blutter
          sed -i "s|sys.platform|'android'|g" blutter.py
          sed -i "s|platform.machine()|'arm64'|g" blutter.py

      - name: Patch dartvm_fetch_build.py for ICU and NDK
        run: |
          cd blutter
          # 1. 在 CMake 行中加入 ICU_ROOT
          sed -i "s|'--log-level=NOTICE'|'--log-level=NOTICE', '-DICU_ROOT=' + os.environ.get('ICU_ROOT', ''), '-DCMAKE_TOOLCHAIN_FILE=' + os.environ.get('NDK_HOME', '') + '/build/cmake/android.toolchain.cmake', '-DANDROID_ABI=arm64-v8a', '-DANDROID_PLATFORM=android-21', '-DCMAKE_C_COMPILER=aarch64-linux-android21-clang', '-DCMAKE_CXX_COMPILER=aarch64-linux-android21-clang++'|g" dartvm_fetch_build.py
          # 2. 确保 import os 在顶部
          grep -q "^import os" dartvm_fetch_build.py || sed -i "1i import os" dartvm_fetch_build.py

      - name: Run blutter.py
        working-directory: blutter
        run: |
          python3 blutter.py ../libs/arm64-v8a ../output

      - name: Extract snapshot hash
        id: get_hash
        run: |
          ADDR=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $1}')
          SIZE=$(nm -D --print-size libs/arm64-v8a/libapp.so | grep _kDartVmSnapshotData | awk '{print $2}')
          dd if=libs/arm64-v8a/libapp.so of=snapshot_data.bin bs=1 skip=$((0x$ADDR)) count=$((0x$SIZE)) status=none
          HASH=$(sha256sum snapshot_data.bin | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Find and rename generated .so
        run: |
          cd blutter
          SO_FILE=$(find . -name "libdartvm*.so" -type f | head -1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find . -name "libblutter*.so" -type f | head -1)
          fi
          if [ -z "$SO_FILE" ]; then
            echo "No .so file found!"
            exit 1
          fi
          echo "Found: $SO_FILE"
          cp "$SO_FILE" ../libblutter_${{ steps.get_hash.outputs.hash }}.so

      - name: Upload Android .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libblutter_android_arm64
          path: libblutter_*.so