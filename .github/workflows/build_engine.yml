name: Build Flutter Engine (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev python3
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Get engine revision
        id: get_rev
        run: |
          ENGINE_REV=$(curl -s https://raw.githubusercontent.com/flutter/flutter/3.24.3/bin/internal/engine.version)
          echo "revision=$ENGINE_REV" >> $GITHUB_OUTPUT
          echo "Engine revision: $ENGINE_REV"

      - name: Checkout Flutter Engine
        uses: actions/checkout@v4
        with:
          repository: flutter/engine
          ref: ${{ steps.get_rev.outputs.revision }}
          fetch-depth: 1
          path: engine

      - name: Cache Engine source
        uses: actions/cache@v3
        id: engine-cache
        with:
          path: engine/src
          key: engine-src-${{ steps.get_rev.outputs.revision }}
          restore-keys: |
            engine-src-${{ steps.get_rev.outputs.revision }}-
            engine-src-

      - name: Sync dependencies
        working-directory: engine
        run: |
          export GCLIENT_METRICS_OPT_IN=0
          gclient config --spec='solutions=[{"name":"src/flutter","url":"https://github.com/flutter/engine.git","deps_file":"DEPS","managed":False}]'
          gclient sync --no-history

      - name: Generate GN build files
        working-directory: engine/src
        run: |
          ./flutter/tools/gn --runtime-mode=release --android --android-cpu=arm64 --unoptimized

      - name: Debug - list out directory (before build)
        working-directory: engine/src
        run: |
          echo "Contents of out/android_release_unopt_arm64:"
          ls -la out/android_release_unopt_arm64/

      - name: Build with Ninja (default target)
        working-directory: engine/src
        run: |
          ninja -C out/android_release_unopt_arm64

      - name: Debug - list out directory (after build)
        working-directory: engine/src
        run: |
          echo "Contents of out/android_release_unopt_arm64:"
          ls -la out/android_release_unopt_arm64/
          echo "Contents of lib.unstripped if exists:"
          ls -la out/android_release_unopt_arm64/lib.unstripped/ || echo "lib.unstripped not found"
          echo "Contents of unstripped if exists:"
          ls -la out/android_release_unopt_arm64/unstripped/ || echo "unstripped not found"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: libflutter_engine_android_arm64
          # 尝试常见路径，如果不存在则失败，但我们会从调试输出确定正确路径
          path: |
            engine/src/out/android_release_unopt_arm64/lib.unstripped/libflutter_engine.so
            engine/src/out/android_release_unopt_arm64/unstripped/libflutter_engine.so
          # 如果多个路径匹配，会一起上传，但实际只会存在一个
          if-no-files-found: error