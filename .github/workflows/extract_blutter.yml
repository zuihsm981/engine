name: Extract Blutter DartVM Binary

on:
  workflow_dispatch:

jobs:
  build-blutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev libfmt-dev
          pip install requests pyelftools

      - name: Clone Blutter
        run: git clone https://github.com/worawit/blutter.git

      - name: Run Blutter
        run: |
          cd blutter
          python3 blutter.py ../libs/arm64-v8a ../output || true

      - name: Upload blutter_dartvm binary
        uses: actions/upload-artifact@v4
        with:
          name: blutter-binaries
          path: blutter/bin/
